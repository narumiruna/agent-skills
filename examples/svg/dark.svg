<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">HTTP Request Journey</title>
  <desc id="svgdesc">Complete HTTP request flow: Client, DNS, Frontend, Backend, Database with latency breakdown.</desc>

  <defs>
    <style>
      .t-title   { font: 700 24px 'Courier New', monospace; fill: #c0caf5; }
      .t-meta    { font: 400 12px 'Courier New', monospace; fill: #565f89; }
      .t-node    { font: 700 18px 'Courier New', monospace; }
      .t-sub     { font: 400 11px 'Courier New', monospace; fill: #a9b1d6; }
      .t-edge    { font: 400 10px 'Courier New', monospace; }
      .t-section { font: 700 11px 'Courier New', monospace; fill: #7aa2f7; }
      .t-hint    { font: 400 11px 'Courier New', monospace; fill: #c0caf5; }
      .t-soft    { font: 400 10px 'Courier New', monospace; fill: #565f89; }
      .t-lat     { font: 400 10px 'Courier New', monospace; fill: #a9b1d6; }
    </style>

    <!-- Arrow markers -->
    <marker id="arr-blue"   markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7aa2f7"/>
    </marker>
    <marker id="arr-green"  markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9ece6a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ff9e64"/>
    </marker>

    <!-- Glow filters per node color -->
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7aa2f7" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-p" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#bb9af7" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-c" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#7dcfff" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-g" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#9ece6a" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-o" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff9e64" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect width="1280" height="500" fill="#0d1117"/>
  <!-- subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1" fill="#7aa2f7" opacity="0.07"/>
  </pattern>
  <rect width="1280" height="500" fill="url(#dots)"/>

  <!-- ===================== HEADER ===================== -->
  <rect x="28" y="16" width="4" height="24" rx="2" fill="#7aa2f7"/>
  <text class="t-title" x="42" y="34">HTTP Request Journey</text>
  <text class="t-meta"  x="1252" y="24" text-anchor="end">PART 01 / 04</text>
  <text class="t-meta"  x="1252" y="38" text-anchor="end">network &amp; latency</text>
  <line x1="28" y1="48" x2="1252" y2="48" stroke="#21262d" stroke-width="1"/>
  <text class="t-meta" x="28" y="60" fill="#9ece6a">$</text>
  <text class="t-meta" x="40" y="60">traceroute https://api.example.com</text>
  <text class="t-meta" x="1252" y="60" text-anchor="end" fill="#3d4466">-- 2026-04-03</text>

  <!-- ===================== LAYER 1: NODE BOXES =====================
       All node rects drawn first so arrows+labels will be on top.
       Nodes: y=74, height=136  (bottom=210)
       Arrows at y=142 (vertical center).
  -->

  <!-- CLIENT box -->
  <g filter="url(#glow-b)">
    <rect x="34"   y="74" width="194" height="136" rx="12" fill="#0d1117" stroke="#7aa2f7" stroke-width="1.5"/>
  </g>
  <rect x="34"   y="74" width="194" height="4"   rx="2" fill="#7aa2f7"/>

  <!-- DNS box -->
  <g filter="url(#glow-p)">
    <rect x="280"  y="74" width="194" height="136" rx="12" fill="#0d1117" stroke="#bb9af7" stroke-width="1.5"/>
  </g>
  <rect x="280"  y="74" width="194" height="4"   rx="2" fill="#bb9af7"/>

  <!-- FRONTEND box -->
  <g filter="url(#glow-c)">
    <rect x="526"  y="74" width="194" height="136" rx="12" fill="#0d1117" stroke="#7dcfff" stroke-width="1.5"/>
  </g>
  <rect x="526"  y="74" width="194" height="4"   rx="2" fill="#7dcfff"/>

  <!-- BACKEND box -->
  <g filter="url(#glow-g)">
    <rect x="772"  y="74" width="194" height="136" rx="12" fill="#0d1117" stroke="#9ece6a" stroke-width="1.5"/>
  </g>
  <rect x="772"  y="74" width="194" height="4"   rx="2" fill="#9ece6a"/>

  <!-- DATABASE box -->
  <g filter="url(#glow-o)">
    <rect x="1018" y="74" width="230" height="136" rx="12" fill="#0d1117" stroke="#ff9e64" stroke-width="1.5"/>
  </g>
  <rect x="1018" y="74" width="230" height="4"   rx="2" fill="#ff9e64"/>

  <!-- ===================== LAYER 2: ARROWS + LABELS =====================
       Drawn AFTER all node boxes → labels are always visible.
       Arrow Y = 142. Labels positioned ABOVE arrow at y=122 (rect), y=133 (text).
       Gap centers:
         Client→DNS:       (228+280)/2 = 254
         DNS→Frontend:     (474+526)/2 = 500
         Frontend→Backend: (720+772)/2 = 746
         Backend→DB:       (966+1018)/2 = 992
  -->

  <!-- Arrow: Client -> DNS -->
  <line x1="229" y1="142" x2="279" y2="142"
        stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <rect x="214" y="122" width="80" height="16" rx="8"
        fill="#0d1117" stroke="#7aa2f7" stroke-width="1"/>
  <text class="t-edge" x="254" y="134" text-anchor="middle" fill="#7aa2f7">DNS Query</text>

  <!-- Arrow: DNS -> Frontend -->
  <line x1="475" y1="142" x2="525" y2="142"
        stroke="#7aa2f7" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <rect x="460" y="122" width="80" height="16" rx="8"
        fill="#0d1117" stroke="#7aa2f7" stroke-width="1"/>
  <text class="t-edge" x="500" y="134" text-anchor="middle" fill="#7aa2f7">TCP :443</text>

  <!-- Arrow: Frontend -> Backend -->
  <line x1="721" y1="142" x2="771" y2="142"
        stroke="#9ece6a" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-green)"/>
  <rect x="706" y="122" width="80" height="16" rx="8"
        fill="#0d1117" stroke="#9ece6a" stroke-width="1"/>
  <text class="t-edge" x="746" y="134" text-anchor="middle" fill="#9ece6a">proxy_pass</text>

  <!-- Arrow: Backend -> Database -->
  <line x1="967" y1="142" x2="1017" y2="142"
        stroke="#ff9e64" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-orange)"/>
  <rect x="952" y="122" width="80" height="16" rx="8"
        fill="#0d1117" stroke="#ff9e64" stroke-width="1"/>
  <text class="t-edge" x="992" y="134" text-anchor="middle" fill="#ff9e64">SQL Query</text>

  <!-- ===================== RESPONSE PATH ===================== -->
  <path d="M 1133 210 L 1133 234 L 131 234" fill="none"
        stroke="#9ece6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="6 3" marker-end="url(#arr-green)"/>
  <rect x="490" y="218" width="200" height="16" rx="8"
        fill="#0d1117" stroke="#9ece6a" stroke-width="1"/>
  <text class="t-edge" x="590" y="230" text-anchor="middle" fill="#9ece6a">HTTP 200 OK (JSON)</text>

  <!-- ===================== LAYER 3: NODE CONTENT =====================
       Icons and text drawn LAST → always on top of arrows/labels.
  -->

  <!-- CLIENT content -->
  <!-- Browser icon -->
  <rect x="115" y="105" width="30" height="22" rx="3" fill="none" stroke="#7aa2f7" stroke-width="1.5"/>
  <line x1="115" y1="111" x2="145" y2="111" stroke="#7aa2f7" stroke-width="1"/>
  <circle cx="121" cy="108" r="2" fill="#f7768e"/>
  <circle cx="127" cy="108" r="2" fill="#ff9e64"/>
  <circle cx="133" cy="108" r="2" fill="#9ece6a"/>
  <rect x="120" y="115" width="20" height="3" rx="1.5" fill="#3d4466"/>
  <text class="t-node" x="131" y="146" text-anchor="middle" fill="#7aa2f7">Client</text>
  <text class="t-sub"  x="131" y="164" text-anchor="middle">Browser</text>
  <text class="t-sub"  x="131" y="178" text-anchor="middle">enters URL</text>

  <!-- DNS content -->
  <!-- Server rack icon -->
  <rect x="361" y="105" width="32" height="8" rx="2" fill="none" stroke="#bb9af7" stroke-width="1.5"/>
  <rect x="361" y="116" width="32" height="8" rx="2" fill="none" stroke="#bb9af7" stroke-width="1.5"/>
  <circle cx="389" cy="109" r="2" fill="#bb9af7"/>
  <circle cx="389" cy="120" r="2" fill="#bb9af7"/>
  <text class="t-node" x="377" y="146" text-anchor="middle" fill="#bb9af7">DNS</text>
  <text class="t-sub"  x="377" y="164" text-anchor="middle">Resolve IP</text>
  <text class="t-sub"  x="377" y="178" text-anchor="middle">address</text>

  <!-- FRONTEND content -->
  <!-- Globe icon -->
  <circle cx="623" cy="113" r="13" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
  <ellipse cx="623" cy="113" rx="5" ry="13" fill="none" stroke="#7dcfff" stroke-width="1"/>
  <line x1="610" y1="113" x2="636" y2="113" stroke="#7dcfff" stroke-width="1"/>
  <text class="t-node" x="623" y="146" text-anchor="middle" fill="#7dcfff">Frontend</text>
  <text class="t-sub"  x="623" y="164" text-anchor="middle">Nginx :443</text>
  <text class="t-sub"  x="623" y="178" text-anchor="middle">TLS + routing</text>

  <!-- BACKEND content -->
  <!-- Lightning icon -->
  <path d="M 874 103 L 861 118 L 869 118 L 857 134 L 878 117 L 869 117 Z" fill="#9ece6a"/>
  <text class="t-node" x="869" y="146" text-anchor="middle" fill="#9ece6a">Backend</text>
  <text class="t-sub"  x="869" y="164" text-anchor="middle">FastAPI :8080</text>
  <text class="t-sub"  x="869" y="178" text-anchor="middle">business logic</text>

  <!-- DATABASE content -->
  <!-- Cylinder icon -->
  <ellipse cx="1133" cy="111" rx="16" ry="6" fill="none" stroke="#ff9e64" stroke-width="1.5"/>
  <line x1="1117" y1="111" x2="1117" y2="126" stroke="#ff9e64" stroke-width="1.5"/>
  <line x1="1149" y1="111" x2="1149" y2="126" stroke="#ff9e64" stroke-width="1.5"/>
  <ellipse cx="1133" cy="126" rx="16" ry="6" fill="none" stroke="#ff9e64" stroke-width="1.5"/>
  <text class="t-node" x="1133" y="146" text-anchor="middle" fill="#ff9e64">Database</text>
  <text class="t-sub"  x="1133" y="164" text-anchor="middle">Postgres :5432</text>
  <text class="t-sub"  x="1133" y="178" text-anchor="middle">persistent store</text>

  <!-- ===================== LATENCY BREAKDOWN ===================== -->
  <g filter="url(#shadow)">
    <rect x="34" y="250" width="1214" height="70" rx="10"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
  </g>
  <text class="t-section" x="50" y="268">// latency_breakdown = {</text>
  <rect x="50"  y="274" width="52"  height="14" rx="3"
        fill="#bb9af7" fill-opacity="0.25" stroke="#bb9af7" stroke-width="1"/>
  <rect x="106" y="274" width="95"  height="14" rx="3"
        fill="#7aa2f7" fill-opacity="0.25" stroke="#7aa2f7" stroke-width="1"/>
  <rect x="205" y="274" width="130" height="14" rx="3"
        fill="#7dcfff" fill-opacity="0.25" stroke="#7dcfff" stroke-width="1"/>
  <rect x="339" y="274" width="260" height="14" rx="3"
        fill="#9ece6a" fill-opacity="0.25" stroke="#9ece6a" stroke-width="1"/>
  <rect x="603" y="274" width="645" height="14" rx="3"
        fill="#ff9e64" fill-opacity="0.25" stroke="#ff9e64" stroke-width="1"/>
  <text class="t-lat" x="76"  y="302" text-anchor="middle">DNS ~5ms</text>
  <text class="t-lat" x="153" y="302" text-anchor="middle">TCP ~20ms</text>
  <text class="t-lat" x="269" y="302" text-anchor="middle">Nginx ~40ms</text>
  <text class="t-lat" x="469" y="302" text-anchor="middle">App ~80ms</text>
  <text class="t-lat" x="925" y="302" text-anchor="middle">DB + Network ~200ms+</text>

  <!-- ===================== NOTE CARD ===================== -->
  <g filter="url(#shadow)">
    <rect x="34" y="332" width="1214" height="36" rx="8"
          fill="#161b22" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.4"/>
  </g>
  <text class="t-section" x="50" y="348" fill="#565f89">//</text>
  <text class="t-hint"    x="66" y="348">In a monolithic architecture, all layers share resources.</text>
  <text class="t-soft"    x="66" y="361">One slow layer blocks the entire request chain -- hotspots: N+1 queries, unindexed lookups, blocking I/O.</text>

  <!-- ===================== HINT CARDS ===================== -->
  <!-- DNS hint -->
  <g filter="url(#shadow)">
    <rect x="34"  y="380" width="368" height="56" rx="8"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
  </g>
  <rect x="34"  y="380" width="4" height="56" rx="2" fill="#bb9af7"/>
  <text class="t-hint" x="48" y="398" fill="#bb9af7">DNS Resolution</text>
  <text class="t-soft" x="48" y="414">~5ms avg; reduced by OS / browser caching.</text>
  <text class="t-soft" x="48" y="428">TTL controls how long cached records live.</text>

  <!-- App hint -->
  <g filter="url(#shadow)">
    <rect x="430" y="380" width="368" height="56" rx="8"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
  </g>
  <rect x="430" y="380" width="4" height="56" rx="2" fill="#9ece6a"/>
  <text class="t-hint" x="444" y="398" fill="#9ece6a">App Processing</text>
  <text class="t-soft" x="444" y="414">Business logic and external I/O are</text>
  <text class="t-soft" x="444" y="428">the most common throughput hotspots.</text>

  <!-- DB hint -->
  <g filter="url(#shadow)">
    <rect x="826" y="380" width="422" height="56" rx="8"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
  </g>
  <rect x="826" y="380" width="4" height="56" rx="2" fill="#ff9e64"/>
  <text class="t-hint" x="840" y="398" fill="#ff9e64">DB Query</text>
  <text class="t-soft" x="840" y="414">Indexes and query patterns set tail latency.</text>
  <text class="t-soft" x="840" y="428">Use EXPLAIN ANALYZE to find slow queries.</text>

</svg>
